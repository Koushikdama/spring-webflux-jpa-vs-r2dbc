spring.application.name=Reactive_Practices

# ============================================================
# Local MySQL (Homebrew, 127.0.0.1:3306), database: reactive_practice
# Both drivers point at the SAME database, so a row written via
# JDBC can be read back via R2DBC (and vice versa).
# The URL picks the database; username/password only log in.
# ============================================================
db.host=localhost
db.port=3306
db.name=reactive_practice
db.username=root
# Real password lives in secrets.properties (git-ignored), or set env var DB_PASSWORD
db.password=${DB_PASSWORD:}
spring.config.import=optional:classpath:secrets.properties

# --- Blocking: JDBC (DataSource / HikariCP -> JdbcClient, JdbcTemplate) ---
spring.datasource.url=jdbc:mysql://${db.host}:${db.port}/${db.name}?createDatabaseIfNotExist=true
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}

# --- Reactive: R2DBC (ConnectionFactory / r2dbc-pool -> DatabaseClient, R2dbcEntityTemplate) ---
spring.r2dbc.url=r2dbc:mysql://${db.host}:${db.port}/${db.name}
spring.r2dbc.username=${db.username}
spring.r2dbc.password=${db.password}

server.port=8080

# Run src/main/resources/schema.sql on startup (Boot only does this automatically
# for embedded DBs like H2; MySQL needs "always")
spring.sql.init.mode=always

# --- Swagger UI (springdoc) ---
# UI:   http://localhost:8080/swagger-ui.html
# JSON: http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
